name: CI

# Deployment is gated by data, service, web and browser checks.
# Inspect the run result before reporting a public release as successful.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data and ingestion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ingestion/requirements-ci.txt

      - name: Install ingestion test dependencies
        run: python -m pip install --disable-pip-version-check -r services/ingestion/requirements-ci.txt

      - name: Run ingestion tests
        run: python -m pytest services/ingestion/tests tests/test_opm_generation.py tests/test_checkout_inventory.py -q

      - name: Verify clean-checkout required files
        run: python scripts/checkout_inventory.py --check

      - name: Check three-locale parity
        run: python scripts/sync_locales.py

      - name: Verify active immutable snapshot
        run: python services/ingestion/src/publish.py --check

      - name: Validate next publication selection
        run: python services/ingestion/src/publish.py --check-sources

      - name: Validate docs and OPM framework
        run: python scripts/check_framework.py

  go:
    name: Go services
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            apps/api/go.sum
            services/catalog/go.sum

      - name: Test catalog service
        working-directory: services/catalog
        run: go test ./...

      - name: Test API service
        working-directory: apps/api
        run: go test ./...

  web:
    name: Web checks and static build
    needs: [data, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit and publication-contract tests
        working-directory: apps/web
        run: npm test

      - name: Run Astro and TypeScript checks
        working-directory: apps/web
        run: npm run check

      - name: Verify browser publication assets
        working-directory: apps/web
        run: npm run verify:published

      - name: Build static site (root-relative; browser acceptance)
        working-directory: apps/web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Record publication provenance in the artifact
        run: python scripts/checkout_inventory.py --write-provenance apps/web/dist/publication-provenance.json

      - name: Upload built site for browser checks
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-build-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 2

  browser:
    name: Browser acceptance
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Download built site
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-build-${{ github.sha }}
          path: apps/web/dist

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance against the built artifact
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy tested site to Cloudflare Pages
    needs: [deliver]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: production-site-${{ github.sha }}
          path: site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Deploy the exact tested artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.131.2 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

  deliver:
    name: Tested production site for external hosting
    needs: [web, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the exact browser-tested site
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-build-${{ github.sha }}
          path: site

      - name: Retain the production site for third-party deployment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-site-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14
