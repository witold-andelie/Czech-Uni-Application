name: Programme page link resolution

# Owner decision 2026-10-03: every programme links to its own official page;
# the university site is only the fallback for a programme whose page cannot
# be found. The resolver walks each school's own catalogue (about 330 s per
# school at the configured depth), which the shared refresh tick never had
# time for: the index was last rewritten 2026-09-28. Here the schools are
# dealt round-robin over parallel shards, least recently read first, and the
# shards' reads are merged into one index. A school whose new read resolves
# fewer pages than its committed floor keeps its previous links (A100), and
# the floor ratchets up to what the index now proves. Links reach the public
# pages only through the next immutable publication.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programme-links
  cancel-in-progress: false

jobs:
  # Schools that publish a structured catalogue (IS/STAG web services, MUNI's
  # programme pages, ČVUT's Bílá kniha, SLU's finder) are read completely
  # first; the records state each programme's level, language and faculty,
  # which binds the register rows a title alone leaves ambiguous.
  catalogues:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ingestion/requirements-runtime.txt
      - name: Install Python collector and Scrapling
        run: python -m pip install -r services/ingestion/requirements-runtime.txt
      - name: Read the school catalogues
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u services/ingestion/src/programme_catalogues.py --live
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: programme-catalogues
          path: data/sources/admissions/catalogue-*.json
          if-no-files-found: warn
          retention-days: 3

  resolve:
    needs: catalogues
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ingestion/requirements-runtime.txt
      - name: Cache Playwright Chromium for Scrapling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-scrapling-0.4.9
      - name: Install Python collector and Scrapling
        run: |
          python -m pip install -r services/ingestion/requirements-runtime.txt
          SCRAPLING_REQUIRED=1 python services/ingestion/src/cli/check_scrapling.py
      - name: Install Playwright Chromium for dynamic catalogue pages
        continue-on-error: true
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: programme-catalogues
          path: data/sources/admissions
      - name: Resolve this shard's schools
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PLAYWRIGHT_LAUNCH_TIMEOUT: "30000"
        run: |
          mkdir -p work/links
          python -u services/ingestion/src/resolve_programme_links.py --live \
            --shard "${{ matrix.shard }}/6" --budget-seconds 5000 \
            --previous data/sources/admissions/programme-links.json \
            --output "work/links/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: programme-links-shard-${{ matrix.shard }}
          path: work/links/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 3

  merge:
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ingestion/requirements-ci.txt
      - name: Install Python dependencies
        run: python -m pip install -r services/ingestion/requirements-ci.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: programme-catalogues
          path: data/sources/admissions
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: programme-links-shard-*
          path: work/links
          merge-multiple: true
      - name: Merge the shards into the link index
        run: |
          set -euo pipefail
          ls -la work/links || true
          shopt -s nullglob
          shards=(work/links/shard-*.json)
          if [ ${#shards[@]} -eq 0 ]; then echo '::error::no shard produced an index'; exit 1; fi
          python services/ingestion/src/resolve_programme_links.py --merge-shards "${shards[@]}" --raise-floor
          python services/ingestion/src/check_programme_link_coverage.py --skip-inventory
      - name: Commit the link index on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add data/sources/admissions/programme-links.json data/sources/admissions/programme-link-coverage-floor.json
          for file in data/sources/admissions/catalogue-*.json; do if [ -f "$file" ]; then git add "$file"; fi; done
          if git diff --cached --quiet; then echo 'No link changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh school-owned programme page link index'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # GITHUB_TOKEN pushes do not trigger push workflows: dispatch CI explicitly.
              gh workflow run ci.yml --ref main
              exit 0
            fi
            sleep 10
          done
          exit 1
