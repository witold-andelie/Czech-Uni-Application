name: Scheduled official-source refresh

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: full tick includes programmes and shards; adapters skips those
        type: choice
        default: adapters
        options:
          - adapters
          - full

permissions:
  contents: read

concurrency:
  group: official-source-refresh-${{ github.event.inputs.mode || 'full' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.mode == 'adapters' && 20 || 50 }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ingestion/requirements-runtime.txt
      - name: Cache Playwright Chromium for Scrapling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-scrapling-0.4.9
      - name: Install Python collector and Scrapling HTTP fetcher
        run: |
          python -m pip install -r services/ingestion/requirements-runtime.txt
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
          python -c "import scrapling; from scrapling.fetchers import Fetcher; print('scrapling', scrapling.__version__)"
          SCRAPLING_REQUIRED=1 python services/ingestion/src/cli/check_scrapling.py
      - name: Install Playwright Chromium for dynamic pages
        continue-on-error: true
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Connect the collector to Supabase over HTTPS
        env:
          SUPABASE_REQUIRED: "1"
          SUPABASE_USE_REST: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python services/ingestion/src/cli/check_supabase.py
          python services/ingestion/src/cli/sync_sources.py
      - name: Restore adapter harvest cursor
        if: ${{ github.event.inputs.mode == 'adapters' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/runs
          cursor=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=adapter-cursor&per_page=5" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$cursor" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$cursor/zip" > /tmp/adapter-cursor.zip
            python -c "import zipfile; zipfile.ZipFile('/tmp/adapter-cursor.zip').extractall('work/runs')"
          fi
      - name: Harvest adapter job sources only
        id: adapters
        if: ${{ github.event.inputs.mode == 'adapters' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PLAYWRIGHT_LAUNCH_TIMEOUT: "30000"
          SCRAPLING_REQUIRED: "1"
          SCRAPLING_ALLOW_BROWSER: "1"
          SUPABASE_REQUIRED: "1"
          SUPABASE_USE_REST: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADAPTER_PREFER_IDS: osu-central-careers,slu-central-vacancies,vetuni-central-vacancies,unob-academic-selection,vstecb-central-vacancies,vspj-academic-vacancies,avcr-selection-procedures,amu-central-vacancies,avu-selection-procedures,jamu-faculty-vacancies,mup-central-vacancies,mvso-central-careers,peuni-central-careers,polac-central-vacancies,unyp-central-careers
        run: python -u services/ingestion/src/cli/ingest_adapters.py --live --budget-seconds 480
      - name: CZU official job tracer into Supabase
        id: czu_jobs
        if: ${{ github.event.inputs.mode != 'adapters' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PLAYWRIGHT_LAUNCH_TIMEOUT: "30000"
          SCRAPLING_REQUIRED: "1"
          SCRAPLING_ALLOW_BROWSER: "1"
          SUPABASE_REQUIRED: "1"
          SUPABASE_USE_REST: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u services/ingestion/src/cli/ingest_source.py --source-id czu-central-jobs --live
      - name: Charles University job tracer into Supabase
        id: cuni_jobs
        if: ${{ github.event.inputs.mode != 'adapters' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PLAYWRIGHT_LAUNCH_TIMEOUT: "30000"
          SCRAPLING_REQUIRED: "1"
          SCRAPLING_ALLOW_BROWSER: "1"
          SUPABASE_REQUIRED: "1"
          SUPABASE_USE_REST: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u services/ingestion/src/cli/ingest_source.py --source-id cuni-central-open-positions --live
      - name: Restore the last scheduler checkpoint
        if: ${{ github.event.inputs.mode != 'adapters' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/runs
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=refresh-state&per_page=10" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" --name refresh-state --dir work/runs
          fi
      - name: Run due tasks with bounded time and persisted retries
        id: crawl
        if: ${{ github.event.inputs.mode != 'adapters' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PLAYWRIGHT_LAUNCH_TIMEOUT: "30000"
          SCRAPLING_REQUIRED: "1"
          SCRAPLING_ALLOW_BROWSER: "1"
          SUPABASE_REQUIRED: "1"
          SUPABASE_USE_REST: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u services/ingestion/src/ci_refresh.py
      - name: Save adapter harvest cursor
        if: ${{ always() && github.event.inputs.mode == 'adapters' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapter-cursor
          path: work/runs/ingest-adapters.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify approved candidates live against official sources
        id: live_verify
        if: ${{ github.event.inputs.mode != 'adapters' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          SCRAPLING_REQUIRED: "1"
          SCRAPLING_ALLOW_BROWSER: "1"
          # Bounded pass: per-host 2 s spacing, documented transport retries,
          # and a wall-clock budget so a tick can never run away. A 404/403/
          # 500/timeout is recorded as source evidence change, never as a
          # closed vacancy (docs/REFRESH_POLICY.md).
          LIVE_VERIFY_BUDGET_SECONDS: "780"
        run: |
          budget="${LIVE_VERIFY_BUDGET_SECONDS:-780}"
          python -u services/ingestion/src/cli/verify_live_titles.py --budget "$budget" || true
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/sources/coverage/live-title-verification.json").read_text(encoding="utf-8"))
          print(json.dumps(payload["summary"], ensure_ascii=False))
          unresolved = [
              row for row in payload["rows"]
              if row["status"] not in ("matched", "operator_verified")
          ]
          print(f"live verification: {len(unresolved)} candidate(s) still unconfirmed (recorded, not closed)")
          PY
      - name: Report the live-evidence publish gate
        if: ${{ always() && steps.live_verify.outcome != 'skipped' }}
        run: |
          python services/ingestion/src/cli/check_live_evidence.py \
            --jobs data/sources/browse/nine-hei-jobs.json \
            --evidence data/sources/coverage/live-title-verification.json || true
      - name: Save scheduler checkpoint even after partial source failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-state
          path: |
            work/runs/schedule-state.json
            work/runs/shard-assignments.json
            work/runs/refresh-state.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain candidates and evidence for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-review-${{ github.run_id }}
          path: |
            data/sources/
            data/published/safety
            data/published/safety-status.json
            work/runs/ci-refresh-summary.json
            work/runs/scrapling-runtime.json
            work/runs/czu-central-jobs-tracer.json
            work/runs/cuni-central-open-positions-tracer.json
            work/runs/ingest-adapters.json
            work/raw/
          if-no-files-found: error
          retention-days: 3
      - name: Commit refreshed live-verification evidence on main
        if: ${{ always() && steps.live_verify.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/sources/coverage/live-title-verification.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh live per-candidate title-verification evidence'
            git push origin HEAD
            # GITHUB_TOKEN pushes do not trigger push workflows: dispatch CI explicitly.
            gh workflow run ci.yml --ref main
          fi
      - name: Keep two recovery bundles to bound artifact storage
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_refresh_artifacts.py
      - name: Publish only verified closure status changes
        if: always() && steps.crawl.outcome != 'skipped' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python services/ingestion/src/publish.py --check
          python services/ingestion/src/safety_status.py --check
          git add data/published/safety data/published/safety-status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified official vacancy closure status'
            git push origin HEAD
            # GITHUB_TOKEN pushes do not trigger push workflows: dispatch CI explicitly.
            gh workflow run ci.yml --ref main
          fi
      - name: Hold verified closures on this branch for review
        if: always() && steps.crawl.outcome != 'skipped' && github.ref != 'refs/heads/main'
        run: |
          python services/ingestion/src/publish.py --check
          python services/ingestion/src/safety_status.py --check
          echo 'This run is not on main. Verified closures stay in candidate-review artifacts; they are not pushed to main.'
      - name: Report recorded source retries
        if: always() && steps.crawl.outcome == 'failure'
        run: |
          echo 'The tick finished. Some started sources recorded retries; leftover work stays queued. See candidate-review and scheduler artifacts.'
      - name: Note deferred remainder
        if: always() && steps.crawl.outcome == 'success'
        run: |
          echo 'Bounded tick finished. Remaining due tasks stay queued for the next wake.'
      - name: Note adapter-only pass
        if: ${{ github.event.inputs.mode == 'adapters' }}
        run: |
          echo 'Adapter-only pass finished. Programme catalogues and shards were not run.'
